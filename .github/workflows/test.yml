name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch format changes in new opencode and Codex releases

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install fzf, opencode and Codex (their tests are skipped without them)
        run: |
          sudo apt-get install -y fzf
          curl -fsSL https://opencode.ai/install | bash || npm install -g opencode-ai || true
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g @openai/codex || true
      - run: opencode --version || echo "opencode not available"
      - run: codex --version || echo "codex not available"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
