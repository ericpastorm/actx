name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch format changes in new opencode and Codex releases

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runs the native CLI and process-inspection integrations more slowly.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 35 || 20 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install fzf, opencode and Codex on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install fzf; else sudo apt-get install -y fzf; fi
          curl -fsSL https://opencode.ai/install | bash || npm install -g opencode-ai
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g @openai/codex
      - name: Install fzf, opencode and Codex on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install fzf -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install -g opencode-ai @openai/codex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm prefix -g >> $env:GITHUB_PATH
      - run: fzf --version
      - run: opencode --version
      - run: codex --version
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  gui:
    name: GUI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri xvfb xauth
      - run: cargo fmt --check
      - run: cargo clippy --locked --features gui --all-targets -- -D warnings
      - name: Test desktop state and launcher
        run: cargo test --locked --features gui --bin actx --bin actx-gui
      - name: Build native desktop and launcher
        run: cargo build --locked --features gui --bins
      - name: Exercise a native Linux window with isolated conversations
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo test --locked --features gui --test desktop -- --ignored --nocapture
