name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly: catch format changes in new opencode and Codex releases

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - name: Install opencode and Codex (their tests are skipped without them)
        run: |
          curl -fsSL https://opencode.ai/install | bash || npm install -g opencode-ai || true
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          npm install -g @openai/codex || true
      - run: opencode --version || echo "opencode not available"
      - run: codex --version || echo "codex not available"
      - run: pytest -v
